name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

# Builds everything a release ships and attaches it to the tag's draft release, through the same
# `scripts/build.mjs` / `scripts/linux/build.sh` used locally (`pnpm build:desktop:mac` and co.):
#   - macOS (Apple Silicon): the desktop app (.zip) and the `soromi` binary (.tar.gz), both signed
#     and notarized when the secrets below are set.
#   - Linux x64 and arm64: the desktop app (.deb, .rpm) and the `soromi` binary (.tar.gz), built in
#     a Debian 11 container so they run on Ubuntu 20.04 / Debian 11 / RHEL 9 and newer.
# Each build job uploads its files; one last job puts them all on the release, so parallel jobs
# never race to create it.
#
# Signing + notarization use Electron Forge's built-in osxSign/osxNotarize. They activate when the
# Developer ID cert is in the keychain; forge.config auto-detects it and otherwise builds unsigned.
#
# Required repo secrets for a signed + notarized build:
#   MACOS_CERTIFICATE_P12         base64 of your exported "Developer ID Application" cert (.p12)
#   MACOS_CERTIFICATE_PASSWORD    the .p12 export password
#   APPLE_ID                      the Apple ID email of the account
#   APPLE_PASSWORD                an app-specific password (appleid.apple.com) for notarization
#   APPLE_TEAM_ID                 the Team ID (Y4VQSWR73G)
jobs:
  mac:
    runs-on: macos-latest
    env:
      # Surfaced so the import step can gate on presence (secrets aren't allowed in `if:`).
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Import the Developer ID cert into a throwaway keychain. forge.config detects it via
      # `security find-identity` and turns on osxSign; osx-sign auto-discovers the identity from here.
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/soromi-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the search list so codesign / osx-sign / find-identity see it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT"

      # The gui build imports @soromi/protocol from its dist output.
      - name: Build protocol
        run: pnpm --filter @soromi/protocol build

      # Builds, signs and notarizes the app with Electron Forge (osxSign / osxNotarize), checks it
      # with Gatekeeper and its stapled ticket, and zips it; then the same for the bare binary.
      - name: Build the desktop app and the CLI
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: 'electron-forge:*,@electron/notarize*,@electron/osx-sign*,@electron/packager*'
        run: |
          node scripts/build.mjs desktop mac
          node scripts/build.mjs cli mac

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: out/release/*
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The oldest glibc we support (2.31): built on the runner itself (Ubuntu 24.04), the binaries
    # would not start on Ubuntu 22.04.
    container: rust:1-bullseye
    env:
      SRC: ${{ github.workspace }}
      OUT: ${{ github.workspace }}/out/release
    steps:
      - uses: actions/checkout@v4

      - name: Build the CLI
        run: bash scripts/linux/build.sh cli

      # Reuses the daemon the CLI step compiled.
      - name: Build the desktop app
        run: bash scripts/linux/build.sh desktop

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: out/release/*
          if-no-files-found: error

  release:
    needs: [mac, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out/release
          merge-multiple: true

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Soromi ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            Download the build for your platform from the assets below.

            - **Desktop:** `Soromi-*-macos-arm64.zip` (Apple Silicon), `.deb` / `.rpm` for Linux.
            - **Server / command line:** `soromi-*-<os>-<arch>.tar.gz`, the daemon and the `soromi`
              command on their own. See `docs/server.md`.

            Every file has a `.sha256` beside it. macOS builds are Developer ID signed and notarized
            when the release secrets are configured.
          files: out/release/*
