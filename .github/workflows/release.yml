name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

# Builds the Electron desktop app (apps/desktop) and attaches it to the tag's release.
# macOS only for now: the Electron shell bundles a natively-compiled `soromi-daemon`, so Windows /
# Linux builds would each need their own runner + daemon compile — add matrix entries when needed.
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gui build imports @soromi/protocol from its dist output.
      - name: Build protocol
        run: pnpm --filter @soromi/protocol build

      # `make` chains: build the release daemon (cargo) + the gui, then run the Electron Forge makers.
      - name: Build the desktop app
        run: pnpm --filter @soromi/desktop make

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Soromi ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            Download the build for your platform from the assets below.

            macOS builds are not notarized. On first launch, open System Settings > Privacy &
            Security and click "Open Anyway" (or right-click Soromi and choose Open).
          files: |
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/*.dmg
