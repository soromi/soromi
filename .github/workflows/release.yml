name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

# Builds the Electron desktop app (apps/desktop) and attaches it to the tag's release.
# macOS only for now: the Electron shell bundles a natively-compiled `soromi-daemon`, so Windows /
# Linux builds would each need their own runner + daemon compile — add matrix entries when needed.
#
# Signing + notarization use Electron Forge's built-in osxSign/osxNotarize. They activate when the
# Developer ID cert is in the keychain; forge.config auto-detects it and otherwise builds unsigned.
#
# Required repo secrets for a signed + notarized build:
#   MACOS_CERTIFICATE_P12         base64 of your exported "Developer ID Application" cert (.p12)
#   MACOS_CERTIFICATE_PASSWORD    the .p12 export password
#   APPLE_ID                      the Apple ID email of the account
#   APPLE_PASSWORD                an app-specific password (appleid.apple.com) for notarization
#   APPLE_TEAM_ID                 the Team ID (Y4VQSWR73G)
jobs:
  build:
    runs-on: macos-latest
    env:
      # Surfaced so the import step can gate on presence (secrets aren't allowed in `if:`).
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Import the Developer ID cert into a throwaway keychain. forge.config detects it via
      # `security find-identity` and turns on osxSign; osx-sign auto-discovers the identity from here.
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/soromi-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the search list so codesign / osx-sign / find-identity see it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT"

      # The gui build imports @soromi/protocol from its dist output.
      - name: Build protocol
        run: pnpm --filter @soromi/protocol build

      # `make` chains: build the release daemon (cargo) + the gui, then run the Electron Forge makers,
      # which sign (osxSign) and notarize (osxNotarize, app-specific password) via the env below.
      - name: Build the desktop app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @soromi/desktop make

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Soromi ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            Download the build for your platform from the assets below.

            macOS builds are Developer ID signed and notarized when the release secrets are configured.
          files: |
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/*.dmg
