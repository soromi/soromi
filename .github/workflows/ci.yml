name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec turbo run build --filter='!@soromi/desktop'

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The app installs on its own, but links the shared packages from the repo, whose own
      # dependencies come from the repo's install.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soromi/protocol build
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm check:mobile

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p soromi-protocol -p soromi-daemon --all-targets -- -D warnings
      - run: cargo test -p soromi-protocol -p soromi-daemon
